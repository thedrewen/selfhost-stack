services:
  stalwart:
    image: stalwartlabs/stalwart:v1
    container_name: stalwart
    hostname: ${MAIL_HOSTNAME:?MAIL_HOSTNAME is required, copy .env.example to .env}
    restart: unless-stopped
    ports:
      - "25:25"
      - "465:465"
      - "993:993"
    volumes:
      - ./etc:/etc/stalwart
      - ./data:/var/lib/stalwart
    networks:
      - shared
    labels:
      - traefik.enable=true
      - traefik.http.routers.stalwart.rule=Host(`${MAIL_HOSTNAME}`)
      - traefik.http.routers.stalwart.entrypoints=websecure
      - traefik.http.routers.stalwart.tls.certresolver=le
      - traefik.http.services.stalwart.loadbalancer.server.port=8080
networks:
  shared:
    name: shared
    external: true