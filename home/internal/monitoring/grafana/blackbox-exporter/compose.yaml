services:
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.1
    container_name: blackbox-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./config.yml:/etc/blackbox_exporter/config.yml:ro
    # Lets the non-root user of the image send ICMP echo requests (ping) without extra capabilities
    sysctls:
      - net.ipv4.ping_group_range=0 2147483647
    networks:
      - shared

networks:
  shared:
    name: shared
    external: true
