services:
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Needed to report the host processes and not the ones of the container
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks:
      - shared

networks:
  shared:
    name: shared
    external: true
